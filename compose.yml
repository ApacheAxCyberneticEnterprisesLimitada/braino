name: doco

x-braino-app: &braino-app
  image: ${DOCO_IMAGE:-doco:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      DOCO_VERSION: ${DOCO_VERSION:-local}
  restart: unless-stopped
  environment:
    DOCO_DATABASE_URL: postgresql://doco:${DOCO_POSTGRES_PASSWORD:?set DOCO_POSTGRES_PASSWORD in .env}@postgres:5432/doco
    DOCO_ENCRYPTION_KEY: ${DOCO_ENCRYPTION_KEY:?set DOCO_ENCRYPTION_KEY in .env}
    BRAINO_SETUP_TOKEN: ${BRAINO_SETUP_TOKEN:?set BRAINO_SETUP_TOKEN in .env}
    DOCO_PUBLIC_HOST: ${DOCO_PUBLIC_HOST:-http://localhost:3000}
    QDRANT_URL: http://qdrant:6333
    BRAINO_CODELINKER_URL: http://codelinker:8080
    BRAINO_CODELINKER_API_TOKEN: ${BRAINO_CODELINKER_API_TOKEN:?set BRAINO_CODELINKER_API_TOKEN in .env}
    BRAINO_PLUGIN_HOST_URL: http://plugin-host:8080
    BRAINO_PLUGIN_HOST_API_TOKEN: ${BRAINO_PLUGIN_HOST_API_TOKEN:?set BRAINO_PLUGIN_HOST_API_TOKEN in .env}
  networks: [private]

services:
  app:
    <<: *braino-app
    ports:
      - "127.0.0.1:${DOCO_HTTP_PORT:-3000}:3000"
    depends_on:
      codelinker:
        condition: service_healthy
      plugin-host:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4

  scheduler:
    <<: *braino-app
    command: ["node", "runtime/scheduler.mjs"]
    # The image's healthcheck asks the web server, which the scheduler doesn't run.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  codelinker:
    image: ${BRAINO_CODELINKER_IMAGE:-braino-codelinker:local}
    build:
      context: .
      dockerfile: services/codelinker/Dockerfile
    restart: unless-stopped
    environment:
      BRAINO_CODELINKER_API_TOKEN: ${BRAINO_CODELINKER_API_TOKEN:?set BRAINO_CODELINKER_API_TOKEN in .env}
      BRAINO_CODELINKER_MAX_FILES: ${BRAINO_CODELINKER_MAX_FILES:-10000}
      BRAINO_CODELINKER_MAX_FILE_BYTES: ${BRAINO_CODELINKER_MAX_FILE_BYTES:-200000}
      BRAINO_CODELINKER_MAX_TOTAL_BYTES: ${BRAINO_CODELINKER_MAX_TOTAL_BYTES:-67108864}
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "braino-codelinker", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    networks: [private]

  plugin-host:
    image: ${BRAINO_PLUGIN_HOST_IMAGE:-braino-plugin-host:local}
    build:
      context: .
      dockerfile: services/plugin-host/Dockerfile
    restart: unless-stopped
    environment:
      BRAINO_PLUGIN_HOST_API_TOKEN: ${BRAINO_PLUGIN_HOST_API_TOKEN:?set BRAINO_PLUGIN_HOST_API_TOKEN in .env}
      BRAINO_PLUGIN_MAX_COMPONENT_BYTES: ${BRAINO_PLUGIN_MAX_COMPONENT_BYTES:-16777216}
      BRAINO_PLUGIN_MAX_MEMORY_BYTES: ${BRAINO_PLUGIN_MAX_MEMORY_BYTES:-67108864}
      BRAINO_PLUGIN_MAX_RESPONSE_BYTES: ${BRAINO_PLUGIN_MAX_RESPONSE_BYTES:-8388608}
      BRAINO_PLUGIN_MAX_EXECUTION_MS: ${BRAINO_PLUGIN_MAX_EXECUTION_MS:-30000}
      BRAINO_PLUGIN_HTTP_TIMEOUT_MS: ${BRAINO_PLUGIN_HTTP_TIMEOUT_MS:-15000}
      BRAINO_PLUGIN_MAX_FUEL: ${BRAINO_PLUGIN_MAX_FUEL:-100000000}
      BRAINO_PLUGIN_MAX_CACHED_COMPONENTS: ${BRAINO_PLUGIN_MAX_CACHED_COMPONENTS:-16}
      PORT: 8080
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "braino-plugin-host", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    networks: [private]

  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: doco
      POSTGRES_USER: doco
      POSTGRES_PASSWORD: ${DOCO_POSTGRES_PASSWORD:?set DOCO_POSTGRES_PASSWORD in .env}
    volumes:
      - doco-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doco -d doco"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - doco-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      DOCO_HOST: ${DOCO_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - doco-caddy-data:/data
      - doco-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]

networks:
  private:

volumes:
  doco-postgres:
  doco-qdrant:
  doco-caddy-data:
  doco-caddy-config:
