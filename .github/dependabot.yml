version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /services/codelinker
    schedule:
      interval: weekly
    groups:
      codelinker-rust:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /services/plugin-host
    schedule:
      interval: weekly
    groups:
      plugin-host-rust:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /services/plugin-host/fixtures/echo-plugin
    schedule:
      interval: weekly
    groups:
      plugin-fixture-rust:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /plugins/ollama-embedding
    schedule:
      interval: weekly
    groups:
      ollama-embedding-plugin-rust:
        patterns: ["*"]
