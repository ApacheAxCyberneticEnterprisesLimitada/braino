name: Release

# A version bump merged to main is a release. When the version in main's
# package.json has no v<version> tag yet, the commit is verified, its packages
# and signed images are published, and the release is created, which tags it.
# Every other push to main finds the tag and stops. Nobody pushes tags by hand.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Find whether this version is released
        run: |
          TAG="v$(jq -r .version package.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # 2 means no such tag; anything else is a failure to ask.
            [ "$status" -eq 2 ] || exit "$status"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  verify-and-publish:
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm verify
      - run: pnpm conformance
      - name: Pack the core packages
        run: |
          mkdir -p release-packages
          pnpm --filter @doco/shared pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @doco/plugin-runtime pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @doco/db pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @doco/index pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @doco/host pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
          pnpm --filter @doco/connector-plugins pack --pack-destination "$GITHUB_WORKSPACE/release-packages"
      - name: Verify the release packages install together
        run: node scripts/verify-release-packages.mjs release-packages

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the Braino image names
        run: |
          APP_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braino"
          CODELINKER_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braino-codelinker"
          PLUGIN_HOST_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braino-plugin-host"
          echo "APP_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
          echo "CODELINKER_IMAGE=$CODELINKER_IMAGE" >> "$GITHUB_ENV"
          echo "PLUGIN_HOST_IMAGE=$PLUGIN_HOST_IMAGE" >> "$GITHUB_ENV"
      - id: app_metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - id: app_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.app_metadata.outputs.tags }}
          labels: ${{ steps.app_metadata.outputs.labels }}
          build-args: DOCO_VERSION=${{ needs.version.outputs.tag }}
          provenance: mode=max
          sbom: true
      - id: codelinker_metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CODELINKER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - id: codelinker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/codelinker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.codelinker_metadata.outputs.tags }}
          labels: ${{ steps.codelinker_metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - id: plugin_host_metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PLUGIN_HOST_IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - id: plugin_host_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/plugin-host/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.plugin_host_metadata.outputs.tags }}
          labels: ${{ steps.plugin_host_metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the immutable image digests
        env:
          APP_DIGEST: ${{ steps.app_build.outputs.digest }}
          CODELINKER_DIGEST: ${{ steps.codelinker_build.outputs.digest }}
          PLUGIN_HOST_DIGEST: ${{ steps.plugin_host_build.outputs.digest }}
        run: |
          cosign sign --yes "${APP_IMAGE}@${APP_DIGEST}"
          cosign sign --yes "${CODELINKER_IMAGE}@${CODELINKER_DIGEST}"
          cosign sign --yes "${PLUGIN_HOST_IMAGE}@${PLUGIN_HOST_DIGEST}"
      - name: Publish the Braino release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release-packages/*.tgz --target "$GITHUB_SHA" \
            --generate-notes --title "Braino ${TAG#v}"
