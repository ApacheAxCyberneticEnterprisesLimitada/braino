name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · typecheck · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: cargo fmt --check --manifest-path services/codelinker/Cargo.toml
      - run: cargo test --locked --manifest-path services/codelinker/Cargo.toml
      - run: cargo clippy --locked --manifest-path services/codelinker/Cargo.toml --all-targets -- -D warnings
      - run: rustup target add wasm32-wasip2
      - run: cargo fmt --check --manifest-path services/plugin-host/fixtures/echo-plugin/Cargo.toml
      - run: cargo build --locked --release --target wasm32-wasip2 --manifest-path services/plugin-host/fixtures/echo-plugin/Cargo.toml
      - run: cargo fmt --check --manifest-path plugins/ollama-embedding/Cargo.toml
      - run: cargo build --locked --release --target wasm32-wasip2 --manifest-path plugins/ollama-embedding/Cargo.toml
      - run: cargo fmt --check --manifest-path services/plugin-host/Cargo.toml
      - run: cargo test --locked --manifest-path services/plugin-host/Cargo.toml
      - run: cargo clippy --locked --manifest-path services/plugin-host/Cargo.toml --all-targets -- -D warnings
      - run: pnpm verify
